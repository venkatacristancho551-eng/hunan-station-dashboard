<body data-mode="people"><main><header><a href="index.html">← 返回湖南省驻店数据平台</a><h1>单人驻店分析</h1><p>选择人员及产品线。开瓶与订单按历史维护人归属，驻店门店指标取本人当月执行门店与责任盘的交集。</p></header><section><select id="line" hidden><option>1935</option><option>真年份</option></select> <select id="subject" ><option value="">请选择人员</option></select> <button id="export">导出当前报表 CSV</button><div id="result" class="scroll" style="margin-top:18px"></div></section><div class="charts" id="charts"></div><p>回款按实收记录汇总。无实收记录的月份显示“待提供”。</p></main><script src="data.js"></script><script src="报表.js"></script></body></html>
