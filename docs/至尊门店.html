<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湖南至尊网点分析</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3f8;color:#282134;font:15px Microsoft YaHei,sans-serif}main{max-width:1400px;margin:auto;padding:25px}header,section,article{border-radius:21px;background:white;padding:22px;margin-bottom:16px}header{background:#472360;color:white}header a{color:white}h1{margin:12px 0}button,select{padding:10px 15px;border:1px solid #ddd;border-radius:12px;background:#faf7ff;font:inherit}button{cursor:pointer}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:12px;border-bottom:1px solid #eee;text-align:right}th{background:#f2ebf8}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.bar{display:grid;grid-template-columns:40px 1fr 85px;gap:8px;align-items:center;margin:12px 0}.bar i{height:9px;width:var(--width);background:#8c55b5;border-radius:6px}.bar b{text-align:right}[hidden]{display:none}input[type=search]{padding:10px 14px;border:1px solid #d8cbe4;border-radius:12px;font:inherit;min-width:0;width:min(100%,290px)}.filters{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.filters select{max-width:100%}.filters small{color:#665874}.store-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.store-cards div{background:#f7f2fb;padding:12px;border-radius:12px}.store-cards strong{display:block;font-size:23px;margin-top:5px}td:first-child,th:first-child{text-align:left}.shop-link{padding:0;border:0;background:none;color:#61318b;text-decoration:underline}#subjectSearch{width:min(100%,350px)}</style>
<body data-mode="premium"><main><header><a href="index.html">← 返回湖南省驻店数据平台</a><h1>湖南至尊网点分析</h1><p>查看湖南至尊网点的驻店、现场售卖、开瓶和订单。点击网点看逐月明细。</p></header><section><select id="line" hidden><option>1935</option><option>真年份</option></select> <div class="filters"><input type="search" id="subjectSearch" placeholder="搜索网点、城市、商家或服务人员" aria-label="搜索至尊门店"><select id="subject" ><option value="">请选择门店</option></select><button id="export">导出当前报表 CSV</button><small id="searchStatus" aria-live="polite"></small></div><div id="storeSummary" hidden></div><div id="result" class="scroll" style="margin-top:18px"></div></section><div class="charts" id="charts"></div><p>服务人员取自网点信息表。驻店执行人按当月活动记录显示。开瓶和订单为门店当月总量。</p></main><script src="data.js"></script><script src="搜索.js"></script><script src="报表.js"></script></body></html>
